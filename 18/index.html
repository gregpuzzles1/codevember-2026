  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="stage" id="stage">
    <div id="scene" role="img" aria-label="A 3D Newton's cradle. Drag a ball to lift it, drag the background to orbit in any direction, scroll or pinch to zoom."></div>

    <header class="title">
      <span class="eyebrow">Codevember · Day 18</span>
      <h1>Pendulum</h1>
      <p class="hint" id="hint">Drag a ball to lift it &middot; drag the space around it to orbit &middot; scroll to zoom</p>
    </header>

    <button class="panel-toggle" id="panelToggle" type="button" aria-expanded="true" aria-controls="panel">Controls</button>

    <section class="panel" id="panel" aria-label="Cradle controls">
      <div class="group">
        <span class="group-label">Launch</span>
        <div class="row">
          <button type="button" data-lift="1">1 ball</button>
          <button type="button" data-lift="2">2 balls</button>
          <button type="button" data-lift="3">3 balls</button>
          <button type="button" id="stop">Stop</button>
        </div>
      </div>

      <div class="group">
        <span class="group-label">View</span>
        <div class="row">
          <button type="button" data-view="front">Front</button>
          <button type="button" data-view="side">Side</button>
          <button type="button" data-view="back">Back</button>
          <button type="button" data-view="top">Top</button>
          <button type="button" data-view="bottom">Bottom</button>
          <button type="button" data-view="iso">3/4</button>
          <button type="button" id="orbit" aria-pressed="false">Auto-orbit</button>
        </div>
      </div>

      <div class="group sliders">
        <label>
          <span class="group-label">Balls <b id="countOut">5</b></span>
          <input id="count" type="range" min="3" max="9" step="1" value="5">
        </label>
        <label>
          <span class="group-label">Speed <b id="speedOut">1.0×</b></span>
          <input id="speed" type="range" min="0.1" max="1.6" step="0.05" value="1">
        </label>
      </div>

      <div class="group">
        <span class="group-label">Options</span>
        <div class="row">
          <button type="button" id="finish">Chrome</button>
          <button type="button" id="friction" aria-pressed="false">Friction: off</button>
          <button type="button" id="pause" aria-pressed="false">Pause</button>
          <button type="button" id="sound" aria-pressed="true">Sound: on</button>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
