<body>
  <main id="experience">
    <div id="scene" class="scene" role="region" aria-label="Interactive 3D view of the Three Gossips"
         aria-describedby="scene-description" tabindex="0" hidden></div>
    <p id="scene-description" class="visually-hidden" hidden>
      Three sandstone towers share a rocky base. A tilted cap tops the left tower. Broad caps top the
      middle and right towers, with a shorter shoulder between them. Drag or use the arrow keys to orbit.
      Use the mouse wheel, pinch, or press plus and minus to zoom.
    </p>
    <figure id="fallback" class="fallback">
      <img src="./three-gossips-reference.jpeg" alt="Three sunlit orange sandstone towers joined at the base against a clear blue sky.">
      <figcaption id="fallback-description">
        A tilted cap tops the left tower. The central tower has a blocky cap, and the right tower has
        a rounded cap. A shorter shoulder stands between them.
      </figcaption>
    </figure>
    <header class="heading"><h1>The Three Gossips</h1></header>
    <div class="controls" id="controls" hidden>
      <button id="veil-action" type="button">Tap or click the veil to reveal the Three Gossips.</button>
    </div>
    <p id="announcement" class="visually-hidden" role="status"></p>
  </main>
